{% set name = "stop-words" %}
{% set version = "2025.11.4" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz"
  sha256: 0459072b54b11e43a6fb4c5b05bda87d2accfc4f14c1697974f3739af0f7b43d

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  noarch: python

requirements:
  host:
    - pip
    - python
  run:
    - python

test:
  imports:
    - stop_words

about:
  home: "https://github.com/Alir3z4/python-stop-words"
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: "Get list of common stop words in various languages in Python"
  doc_url: "https://github.com/Alir3z4/python-stop-words"
  dev_url: "https://github.com/Alir3z4/python-stop-words"

extra:
  recipe-maintainers:
    - Ryan-Dmello
